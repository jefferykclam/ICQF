[build-system]
# Cython + NumPy are needed only to *build* the _cdnmf_fast_cy extension.
# uv installs these into an isolated build environment automatically; they are
# not runtime dependencies.
requires = ["setuptools>=64", "Cython>=0.29", "numpy>=1.21"]
build-backend = "setuptools.build_meta"

[project]
name = "icqf"
version = "0.1.0"
description = "Standalone, DataFrame-friendly Interval-Constrained Quantile Factorization (ICQF)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scikit-learn>=1.0",
    "tqdm>=4.0",
]

[project.optional-dependencies]
# Only needed to run the synthetic-data helpers in _generate_examples.py / the demo notebooks.
examples = ["scipy>=1.7", "matplotlib>=3.4", "jupyter"]

[tool.setuptools]
# Pure-Python build discovery would miss the compiled extension; declare the
# package explicitly and ship the Cython source so an sdist can be rebuilt.
packages = ["icqf"]

[tool.setuptools.package-data]
icqf = ["*.pyx", "*.c"]
